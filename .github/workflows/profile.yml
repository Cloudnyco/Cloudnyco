name: profile

on:
  schedule:
    - cron: '17 0 * * *' # daily, 00:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/**', 'assets/fonts/**', '.github/workflows/profile.yml']

permissions:
  contents: write

concurrency:
  group: profile
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The Actions token cannot read this account's pull requests in other repositories; a fine-grained personal
      # token with public read access (secret NCN) can. Without it the stats card is left unchanged.
      - name: Build SVGs
        run: node scripts/build.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.NCN || secrets.GITHUB_TOKEN }}
      - name: Commit changes
        run: |
          if git diff --quiet -- assets; then echo "assets unchanged"; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets
          git commit -m 'chore: refresh profile stats'
          git push
